<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.9.1/underscore.js"></script>
    <title>Rock Paper Scissors</title>
</head>
<body>
    <header>ROCK PAPER SCISSORS</header>
    <div id="game">
        <div id="choices">
            <input id="rock" type="image" src="./images/rock.svg">
            <input id="paper" type="image" src="./images/paper.svg">
            <input id="scissors" type="image" src="./images/scissors.svg">
        </div>
        <ul>
            <li class="hChoice">The human hasn't choose yet!</li>
            <li class="cChoice">The computer hasn't choose yet!</li>
            <li class="results">No game played yet.</li>
            <li class="score">The score is: Human: 0 Computer: 0</li>           
        </ul>
    </div>
    
    <div id="myModal" class="modal">
        <div class="modalContent">
            <p class="modalText">Some text in the Modal..</p>
            <img src="./images/trophy.svg" alt="trophy" id="modalImg">
            <span class="close">Play Again?</span>
        </div>
    </div>
    
    <footer>
        <div id="copyright"></div>
    </footer>
    <script src="javascript.js"></script>
</body>
</html>
